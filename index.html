<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modular photography prompt builder" />
  <title>Photography Prompt Builder</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="page">
    <div class="layout">
      <section class="photography-card" aria-labelledby="photographyTitle">
        <header class="card-header">
          <p class="eyebrow">PROMPT STUDIO</p>
          <h1 id="photographyTitle">Photography</h1>
          <p class="subtitle">Customize your photo with the settings below.</p>
        </header>
        <div id="categoriesContainer" class="categories-grid"></div>
      </section>

      <section class="prompt-card" aria-labelledby="promptTitle">
        <div class="prompt-header">
          <div>
            <p class="eyebrow">LIVE PREVIEW</p>
            <h2 id="promptTitle">Generated Prompt</h2>
          </div>
          <button type="button" id="copyButton" class="copy-button">Copy prompt</button>
        </div>
        <p id="generatedPrompt" aria-live="polite"></p>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
</body>
</html>
