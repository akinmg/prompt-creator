
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Modular photography prompt builder"
  />

  <title>Photography Prompt Builder</title>

  <link rel="stylesheet" href="./css/style.css" />
  <script type="module" src="./js/app.js"></script>
</head>

<body>
  
<main class="page">
  <header class="card-header">
    <h1>Photography Prompt Builder</h1>
    <p class="subtitle">Open a section to adjust options. Switches control which modules are included in the prompt.</p>
  </header>
  <div class="layout">

    <div class="modules-panel">

      <!-- PHOTOGRAPHY -->
      <section class="module-card"
               data-module="photography">

        <div class="module-header">
          <button class="module-toggle"
                  type="button"
                  aria-expanded="false"
                  aria-controls="photographyCategoriesContainer">
            <span class="module-chevron">›</span>
            Photography
          </button>

          <label class="switch">
            <input type="checkbox"
                   id="photographySwitch"
                   data-module-switch="photography"
                   checked
                   aria-label="Enable Photography">
            <span class="switch-slider"></span>
          </label>
        </div>

        <div id="photographyCategoriesContainer"
             class="categories-container module-content"
             data-module-content="photography"
             hidden></div>

      </section>

      <!-- PHYSICAL PROPERTIES -->
      <section class="module-card"
               data-module="phisicalProperty">

        <div class="module-header">
          <button class="module-toggle"
                  type="button"
                  aria-expanded="false"
                  aria-controls="phisicalPropertyCategoriesContainer">
            <span class="module-chevron">›</span>
            Physical Properties
          </button>

          <label class="switch">
            <input type="checkbox"
                   id="phisicalPropertySwitch"
                   data-module-switch="phisicalProperty"
                   checked
                   aria-label="Enable Physical Properties">
            <span class="switch-slider"></span>
          </label>
        </div>

        <div id="phisicalPropertyCategoriesContainer"
             class="categories-container module-content"
             data-module-content="phisicalProperty"
             hidden></div>

      </section>
      <!-- VISIBILITY PROPERTIES -->
      <section class="module-card"
               data-module="visibility">

        <div class="module-header">
          <button class="module-toggle"
                  type="button"
                  aria-expanded="false"
                  aria-controls="visibilityCatagoriesContainer">
            <span class="module-chevron">›</span>
            Visibility
          </button>

          <label class="switch">
            <input type="checkbox"
                   id="visibilitySwitch"
                   data-module-switch="visibility"
                   checked
                   aria-label="Enable Visibility">
            <span class="switch-slider"></span>
          </label>
        </div>

        <div id="visibilityCatagoriesContainer"
             class="categories-container module-content"
             data-module-content="visibility"
             hidden></div>

      </section>

    </div>

    <!-- GENERATED PROMPT -->
    <section class="prompt-card">
      <div class="prompt-header">
        <h2>Generated Prompt</h2>
        <button type="button"
                id="copyButton"
                class="copy-button">
          Copy
        </button>
      </div>

      <p id="generatedPrompt"
         aria-live="polite"></p>

      <p id="feedback"
         class="feedback"
         role="status"></p>
    </section>

  </div>
</main>

</body>
</html>
