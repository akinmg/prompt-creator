
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Modular photography prompt builder"
  />

  <title>Photography Prompt Builder</title>

  <link rel="stylesheet" href="./css/style.css" />
  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <main class="page">
    <div class="layout">

      <!-- PHOTOGRAPHY -->
      <section
        class="photography-card"
        data-module="photography"
      >
        <div class="photography-header">
          <h2>Photography</h2>

          <label class="switch">
            <input
              type="checkbox"
              id="photographySwitch"
              data-module-switch="photography"
              checked
              aria-label="Enable Photography"
            />
            <span class="switch-slider"></span>
          </label>
        </div>

        <div
          id="photographyCategoriesContainer"
          class="categories-container"
          data-module-content="photography"
        ></div>
      </section>


      <!-- PHYSICAL PROPERTIES -->
      <section
        class="photography-card"
        data-module="phisicalProperty"
      >
        <div class="photography-header">
          <h2>Physical Properties</h2>

          <label class="switch">
            <input
              type="checkbox"
              id="phisicalPropertySwitch"
              data-module-switch="phisicalProperty"
              checked
              aria-label="Enable Physical Properties"
            />
            <span class="switch-slider"></span>
          </label>
        </div>

        <div
          id="phisicalPropertyCategoriesContainer"
          class="categories-container"
          data-module-content="phisicalProperty"
        ></div>
      </section>


      <!-- GENERATED PROMPT -->
      <section
        class="prompt-card"
        aria-labelledby="promptTitle"
      >
        <div class="prompt-header">
          <div>
            <p class="eyebrow">LIVE PREVIEW</p>
            <h2 id="promptTitle">Generated Prompt</h2>
          </div>

          <button
            type="button"
            id="copyButton"
            class="copy-button"
          >
            Copy prompt
          </button>
        </div>

        <p
          id="generatedPrompt"
          aria-live="polite"
        ></p>

        <p
          id="feedback"
          class="feedback"
          role="status"
          aria-live="polite"
        ></p>
      </section>

    </div>
  </main>
</body>
</html>
